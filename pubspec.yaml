name: sun_stickers
description: Учебный магазин стикеров — восемь способов управления состоянием.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  font_awesome_flutter: 10.7.0
  badges: 3.1.2
  flutter_rating_bar: 4.0.1
  get: 4.6.6
  flutter_bloc: 8.1.6
  mobx: 2.3.3
  flutter_mobx: 2.2.1+1
  redux: 5.0.0
  flutter_redux: 0.10.0
  provider: 6.1.2
  flutter_riverpod: 2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: AppIcon
      fonts:
        - asset: assets/fonts/AppIcon.ttf
